[pytest]
# Run from the project root:  pytest            (all tests)
#                             pytest -m "not index"   (skip tests that need the built Chroma index)
pythonpath = .
testpaths = tests
addopts = -q
markers =
    index: needs the vector index in data/chroma (run `python -m backend.ingest` first)
filterwarnings =
    ignore::DeprecationWarning
